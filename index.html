<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thomas Games</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1024;
      color: #ffffff;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      background: #151a38;
      border-bottom: 1px solid #2b3157;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 8px 0 0;
      color: #a9b1d6;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .section {
      background: #171b34;
      border: 1px solid #2b3157;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: #10142a;
      border: 1px solid #333a63;
      border-radius: 14px;
      padding: 18px;
    }

    .game-emoji {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .game-title {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .game-description {
      margin: 0 0 14px;
      color: #a9b1d6;
      font-size: 14px;
      line-height: 1.45;
    }

    .game-category {
      display: inline-block;
      margin-bottom: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #232a4d;
      color: #b9c2ff;
      font-size: 12px;
    }

    .play-button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #5b7cfa;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .play-button:hover {
      background: #4a69e0;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #d7dcff;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333a63;
      background: #10142a;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #6c8cff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #5b7cfa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4a69e0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .status.success {
      display: block;
      background: rgba(38, 166, 91, 0.18);
      border: 1px solid #2ea361;
      color: #7ee2a8;
    }

    .status.error {
      display: block;
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid #e74c3c;
      color: #ff9d94;
    }

    .review-box {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #10142a;
      border: 1px solid #333a63;
      border-radius: 12px;
    }

    .review-emoji {
      font-size: 42px;
    }

    .review-url {
      margin-top: 10px;
      color: #8f9ad0;
      font-size: 12px;
      word-break: break-all;
    }

    .empty {
      color: #a9b1d6;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {
      main {
        padding: 14px;
      }

      .section {
        padding: 18px;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎮 Thomas Games</h1>
    <p>Play community games and upload your own.</p>
  </header>

  <main>
    <section class="section">
      <h2>Available Games</h2>
      <div id="gamesGrid" class="games-grid"></div>
      <div id="emptyGames" class="empty">No games have been uploaded yet.</div>
    </section>

    <section class="section">
      <h2>Upload a Game</h2>

      <form id="gameForm">
        <label for="title">Game title</label>
        <input
          id="title"
          type="text"
          placeholder="My awesome game"
          required
        />

        <label for="description">Description</label>
        <textarea
          id="description"
          placeholder="Tell players what your game is about"
          required
        ></textarea>

        <label for="emoji">Game emoji</label>
        <input
          id="emoji"
          type="text"
          maxlength="4"
          value="🎮"
          placeholder="🎮"
        />

        <label for="bucketUrl">Game bucket URL</label>
        <input
          id="bucketUrl"
          type="url"
          placeholder="https://your-bucket.supabase.co/storage/v1/object/public/games/game.html"
          required
        />

        <label for="category">Category</label>
        <select id="category">
          <option value="action">Action</option>
          <option value="adventure">Adventure</option>
          <option value="puzzle">Puzzle</option>
          <option value="racing">Racing</option>
          <option value="strategy">Strategy</option>
          <option value="other">Other</option>
        </select>

        <button id="reviewButton" type="submit">Review</button>
      </form>

      <div id="status" class="status"></div>

      <div id="reviewBox" class="review-box">
        <div id="reviewEmoji" class="review-emoji">🎮</div>
        <h3 id="reviewTitle"></h3>
        <p id="reviewDescription"></p>
        <div id="reviewCategory"></div>
        <div id="reviewUrl" class="review-url"></div>
      </div>
    </section>
  </main>

  <script>
    // ============================================
    // REPLACE ONLY THESE TWO LINES
    // ============================================
    const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    // ============================================

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const gamesGrid = document.getElementById("gamesGrid");
    const emptyGames = document.getElementById("emptyGames");
    const gameForm = document.getElementById("gameForm");
    const reviewButton = document.getElementById("reviewButton");
    const statusBox = document.getElementById("status");
    const reviewBox = document.getElementById("reviewBox");

    async function loadGames() {
      try {
        const { data, error } = await supabase
          .from("games")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          throw error;
        }

        gamesGrid.innerHTML = "";

        if (!data || data.length === 0) {
          emptyGames.style.display = "block";
          emptyGames.textContent = "No games have been uploaded yet.";
          return;
        }

        emptyGames.style.display = "none";

        data.forEach(function (game) {
          const card = document.createElement("div");
          card.className = "game-card";

          const emoji = document.createElement("div");
          emoji.className = "game-emoji";
          emoji.textContent = game.emoji || "🎮";

          const title = document.createElement("h3");
          title.className = "game-title";
          title.textContent = game.title || "Untitled game";

          const description = document.createElement("p");
          description.className = "game-description";
          description.textContent = game.description || "No description provided.";

          const category = document.createElement("div");
          category.className = "game-category";
          category.textContent = game.category || "Other";

          const playButton = document.createElement("a");
          playButton.className = "play-button";
          playButton.href = game.bucket_url || "#";
          playButton.target = "_blank";
          playButton.rel = "noopener";
          playButton.textContent = "Play game";

          card.appendChild(emoji);
          card.appendChild(title);
          card.appendChild(description);
          card.appendChild(category);
          card.appendChild(playButton);

          gamesGrid.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        emptyGames.style.display = "block";
        emptyGames.textContent =
          "Could not load games: " + (error.message || "Unknown error");
      }
    }

    function showMessage(message, type) {
      statusBox.textContent = message;
      statusBox.className = "status " + type;
    }

    function showReview(game) {
      document.getElementById("reviewEmoji").textContent = game.emoji || "🎮";
      document.getElementById("reviewTitle").textContent = game.title;
      document.getElementById("reviewDescription").textContent =
        game.description;
      document.getElementById("reviewCategory").textContent =
        "Category: " + game.category;
      document.getElementById("reviewUrl").textContent = game.bucket_url;

      reviewBox.style.display = "block";
    }

    gameForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const emoji = document.getElementById("emoji").value.trim() || "🎮";
      const bucket_url = document.getElementById("bucketUrl").value.trim();
      const category = document.getElementById("category").value;

      if (!title || !description || !bucket_url) {
        showMessage(
          "Please fill in the title, description, and bucket URL.",
          "error"
        );
        return;
      }

      const game = {
        title: title,
        description: description,
        emoji: emoji,
        bucket_url: bucket_url,
        category: category
      };

      reviewButton.disabled = true;
      reviewButton.textContent = "Reviewing...";
      showMessage("", "");
      reviewBox.style.display = "none";

      try {
        showReview(game);

        const { data, error } = await supabase
          .from("games")
          .insert(game)
          .select();

        if (error) {
          throw error;
        }

        showMessage("Game reviewed and uploaded successfully!", "success");

        gameForm.reset();
        document.getElementById("emoji").value = "🎮";

        loadGames();
      } catch (error) {
        console.error(error);
        showMessage(
          "Could not upload game: " + (error.message || "Unknown error"),
          "error"
        );
      } finally {
        reviewButton.disabled = false;
        reviewButton.textContent = "Review";
      }
    });

    loadGames();
  </script>
</body>
</html>
